name: Product preview checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.10
      - run: uv sync --locked
      - run: uv build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.10
      - run: uv sync --locked --project ../backend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and Dockerfile contracts
        run: python3 scripts/verify_compose.py
      - name: Start Docker Compose stack and wait for healthchecks
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify container health and HTTP endpoints
        run: |
          docker compose ps
          python3 -c "import json, urllib.request; b = json.loads(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10).read()); f = json.loads(urllib.request.urlopen('http://127.0.0.1:5173/api/v1/health', timeout=10).read()); assert b == {'status': 'ok', 'service': 'vibeos', 'version': '0.1.0'}, b; assert f == b, f; html = urllib.request.urlopen('http://127.0.0.1:5173/', timeout=10).read().decode(); assert '<div id=\"root\">' in html"
      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
