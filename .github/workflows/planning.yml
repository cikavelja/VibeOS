name: Planning integrity
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.10
      - run: uv sync --locked --project backend
      - run: python scripts/progress.py --write
      - run: git diff --exit-code -- docs/PROGRESS.md docs/REQUIREMENTS_TRACEABILITY.md
      - run: python scripts/progress.py --check
      - run: python scripts/verify_locks.py
      - run: python scripts/verify_compose.py
      - run: python scripts/verify_ci.py
      - run: uv run --project backend ruff check scripts/progress.py scripts/verify_locks.py scripts/verify_compose.py scripts/verify_ci.py scripts/tests/test_progress.py scripts/tests/test_locks.py scripts/tests/test_compose.py scripts/tests/test_ci.py
      - run: uv run --project backend ruff format --check scripts/progress.py scripts/verify_locks.py scripts/verify_compose.py scripts/verify_ci.py scripts/tests/test_progress.py scripts/tests/test_locks.py scripts/tests/test_compose.py scripts/tests/test_ci.py
      - run: uv run --project backend mypy --strict scripts/progress.py scripts/verify_locks.py scripts/verify_compose.py scripts/verify_ci.py scripts/tests/test_progress.py scripts/tests/test_locks.py scripts/tests/test_compose.py scripts/tests/test_ci.py
      - run: python -m unittest discover -s scripts/tests
